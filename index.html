<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="PAM - Plataforma digital que conecta productores agrícolas verificados de Michoacán directamente con compradores reales. Sin intermediarios, trato directo y justo." />
  <title>PAM - Productores Agroalimentarios de Michoacán</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>" />

  <!-- TailwindCSS vía CDN (configuración del tema PAM) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#8a8e39",
            "primary-hover": "#6e722d",
            "primary-dark": "#6c702d",
            "pam-green": "#388E3C",
            "pam-green-dark": "#2E7D32",
            "pam-green-light": "#C8E6C9",
            "background-light": "#f7f8f6",
            "background-dark": "#1d1d15",
            "surface-light": "#ffffff",
            "surface-dark": "#2a2a20",
            "earth": "#D7CCC8",
            "gold-accent": "#D4AF37",
            "gold-bg": "#FFF8E1",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"],
            "body": ["Noto Sans", "sans-serif"],
          },
        },
      },
    }
  </script>

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans:wght@400;500;700&display=swap"
    rel="stylesheet" />

  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    /* Custom Scrollbar for Chatbot */
    .scrollbar-thin::-webkit-scrollbar {
      width: 6px;
    }

    .scrollbar-thin::-webkit-scrollbar-track {
      background: transparent;
    }

    .scrollbar-thin::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 20px;
    }

    /* Hide scrollbar utility */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Fade-in animation for modals and chatbot */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.25s ease-out both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.3s ease-out both;
    }
  </style>
</head>

<body class="bg-background-light text-[#161613] antialiased">
  <div id="root"></div>
  <!-- Vite entry point — Vite resuelve todos los módulos desde node_modules -->
  <script type="module" src="/index.tsx"></script>
</body>

</html>
