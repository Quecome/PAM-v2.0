[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  port = 3000
  targetPort = 3000

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  # GEMINI_API_KEY debe configurarse en Netlify Dashboard > Site settings > Environment variables
  # NUNCA en el código fuente ni en .env del cliente
  VITE_SUPABASE_URL = ""
  VITE_SUPABASE_ANON_KEY = ""
